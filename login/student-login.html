<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal Login | Hasseeb Achievers Academy</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<section class="login-page">

<div class="login-container">

<div class="login-left">

<img src="../image/ddr2.jpg" alt="School Logo">

<h2>Hasseeb Achievers Academy</h2>

<p>Aspiring for Excellence</p>

<h3>Student Portal</h3>

<p>
Access your results, attendance, assignments,
timetable and CBT examinations.
</p>

</div>

<div class="login-right">

<form id="studentLoginForm" class="login-form">

<h2>Student Login</h2>

<div class="input-group">
<i class="fa-solid fa-user"></i>
<input type="text" placeholder="Student ID" required>
</div>

<div class="input-group">
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Password" required>
</div>

<div class="login-options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

</form>

</div>

</div>

</section>

<script>

document
.getElementById("studentLoginForm")
.addEventListener("submit", function(e){

e.preventDefault();

alert("Student Login Successful (Demo)");

window.location.href =
"../student/dashboard.html";

});

</script>

</body>
</html>
