<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="teacher-login-container">

<div class="teacher-login-card">

<img src="../image/ddr2.jpg" alt="School Logo">

<h2>Teacher Portal</h2>

<p>Hasseeb Achievers Academy</p>

<form id="teacherLoginForm">

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<button type="submit">
Login
</button>

</form>

<p class="demo-account">
Demo Login:<br>
teacher / 12345
</p>

</div>

</div>

<script>

document
.getElementById("teacherLoginForm")
.addEventListener("submit", function(e){

e.preventDefault();

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
(username === "teacher" && password === "12345") ||
(username === "mathteacher" && password === "12345")
){

window.location.href =
"dashboard.html";

}else{

alert("Invalid Login Details");

}

});

</script>

</body>
</html>
