<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link rel="stylesheet"
href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="sidebar-logo">

<img src="../image/ddr2.jpg">

<h3>Student Portal</h3>

</div>

<ul>

<li>

<a href="dashboard.html">

<i class="fa-solid fa-chart-line"></i>

Dashboard

</a>

</li>

<li>

<a href="attendance.html">

<i class="fa-solid fa-calendar-check"></i>

Attendance

</a>

</li>

<li class="active">

<a href="profile.html">

<i class="fa-solid fa-user"></i>

My Profile

</a>

</li>

<li>

<a href="assignments.html">

<i class="fa-solid fa-book"></i>

Assignments

</a>

</li>

<li>

<a href="results.html">

<i class="fa-solid fa-file-lines"></i>

Results

</a>

</li>

<li>

<a href="timetable.html">

<i class="fa-solid fa-table"></i>

Timetable

</a>

</li>

<li>

<a href="cbt.html">

<i class="fa-solid fa-laptop"></i>

CBT Exams

</a>

</li>

<li>

<a href="#"
onclick="logoutStudent()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>

</ul>

</div>

<!-- MAIN -->

<div class="dashboard-main">

<div class="page-header">

<h2>My Profile</h2>

<button
class="save-btn"
onclick="saveProfile()">

Save Changes

</button>

</div>

<div class="profile-card">

<div class="profile-image">

<img

id="previewImage"

src="../image/ddr2.jpg">
<input

type="file"

id="profilePhoto"

onchange="previewPhoto(event)">

</div>

<div class="profile-form">

<input

id="profileName"

type="text"

placeholder="Student Name">
  
<input

id="profileId"

type="text"

placeholder="Admission Number">

<input

id="profileClass"

type="text"

placeholder="Class">

<input

id="profileGender"

type="text"

placeholder="Gender">

<input
type="date">

<input
type="text"
value="08012345678"
placeholder="Phone Number">

<input

id="profileParent"

type="text"

placeholder="Parent Name">
  
<input

id="profileParentPhone"

type="text"

placeholder="Parent Phone">

<input

id="profileEmail"

type="email"

placeholder="Email">

<hr>

<h3>Change Password</h3>

<input
type="password"
placeholder="Current Password">

<input
type="password"
placeholder="New Password">

<input
type="password"
placeholder="Confirm Password">

</div>

</div>

</div>

</div>

<script type="module">

import {

getStudents

}

from "../firebase/students.js";

async function loadProfile(){

const students =

await getStudents();

if(

students.length===0

){

return;

}

const student =

students[0];

document.getElementById(

"profileName"

).value =

student.name || "";



document.getElementById(

"profileId"

).value =

student.studentId || "";



document.getElementById(

"profileClass"

).value =

student.class || "";



document.getElementById(

"profileGender"

).value =

student.gender || "";



document.getElementById(

"profileParent"

).value =

student.parent || "";

}

loadProfile();

window.previewPhoto =

function(event){

document.getElementById(

"previewImage"

).src =

URL.createObjectURL(

event.target.files[0]

);

}

window.saveProfile =

function(){

alert(

"Profile Updated"

);

}

window.logoutStudent =

function(){

if(

confirm(

"Are you sure you want to logout?"

)

){

window.location.href =

"../portal.html";

}

}

</script>

</body>

</html>
