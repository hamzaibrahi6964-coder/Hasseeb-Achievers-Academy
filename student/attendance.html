<!-- MAIN -->

<div class="dashboard-main">

<div class="page-header">

<h2>Attendance Record</h2>

</div>

<!-- STATISTICS -->

<div class="teacher-stats">

<div class="teacher-stat-card">

<h2 id="attendanceRate">

0%

</h2>

<p>Attendance Rate</p>

</div>

<div class="teacher-stat-card">

<h2 id="presentDays">

0

</h2>
  
<p>Present Days</p>

</div>

<div class="teacher-stat-card">

<h2 id="absentDays">

0

</h2>

<p>Absent Days</p>

</div>

<div class="teacher-stat-card">

<h2 id="lateDays">

0

</h2>

<p>Late Days</p>

</div>

</div>

<!-- ATTENDANCE TABLE -->

<div class="table-container">

<table class="student-table">

<thead>

<tr>

<th>Date</th>

<th>Day</th>

<th>Status</th>

</tr>

</thead>
  
<tbody id="studentAttendanceTable">

</tbody>

</table>

</div>

<!-- SUMMARY -->

<div class="admin-section">

<h3>Attendance Summary</h3>

<div class="activity-box">

Excellent attendance performance.

</div>

</div>

</div>

</div>

<script type="module">

import {

getAttendance

}

from "../firebase/attendance.js";

async function loadAttendance(){

const records =

await getAttendance();

const table =

document.getElementById(

"studentAttendanceTable"

);

table.innerHTML = "";

let present = 0;

let absent = 0;

let late = 0;

records.forEach(item=>{

if(

item.status==="Present"

){

present++;

}

else if(

item.status==="Absent"

){

absent++;

}

else if(

item.status==="Late"

){

late++;

}

let badge =

"present-badge";

if(

item.status==="Absent"

){

badge="absent-badge";

}

if(

item.status==="Late"

){

badge="late-badge";

}

const day =

new Date(

item.date

).toLocaleDateString(

"en-US",

{

weekday:"long"

}

);

table.innerHTML += `

<tr>

<td>${item.date}</td>

<td>${day}</td>

<td>

<span class="${badge}">

${item.status}

</span>

</td>

</tr>

`;

});

const total =

present +

absent +

late;

let rate = 0;

if(total>0){

rate = Math.round(

(present/total)*100

);

}

document.getElementById(

"attendanceRate"

).innerText =

rate + "%";

document.getElementById(

"presentDays"

).innerText =

present;

document.getElementById(

"absentDays"

).innerText =

absent;

document.getElementById(

"lateDays"

).innerText =

late;

}

loadAttendance();

window.logoutStudent =

function(){

if(

confirm(

"Are you sure you want to logout?"

)

){

window.location.href =

"../portal.html";

}

}

</script>
