Assignments

</li>

<a href="results.html">

</ul>

</div>

<!-- MAIN -->

<div class="dashboard-main">

<div class="page-header">

<h2>Academic Results</h2>

<button
class="download-result-btn">

Download Report Card

</button>

</div>

<!-- FILTERS -->

<div class="student-tools">

<select>

<option>2025/2026 Session</option>

<option>2026/2027 Session</option>

</select>

<select>

<option>First Term</option>

<option>Second Term</option>

<option>Third Term</option>

</select>

</div>

<!-- SUMMARY -->

<div class="teacher-stats">

<div class="teacher-stat-card">

<h2 id="averageScore">

0%

</h2>

<p>Average Score</p>

</div>

<div class="teacher-stat-card">

<h2 id="classPosition">

-

</h2>

<p>Class Position</p>

</div>

<div class="teacher-stat-card">

<h2 id="overallGrade">

-

</h2>

<p>Overall Grade</p>

</div>

</div>

<!-- RESULT TABLE -->

<div class="table-container">

<table class="student-table">

<thead>

<tr>

<th>Subject</th>

<th>Total</th>

<th>Grade</th>

<th>Remark</th>

</tr>

</thead>

<tbody id="studentResultsTable">


</tbody>

</table>

</div>

<!-- TEACHER REMARK -->

<div class="admin-section">

<h3>Teacher's Remark</h3>

<div

class="activity-box"

id="teacherRemark">

No Remark

</div>

</div>

<!-- PRINCIPAL REMARK -->

<div class="admin-section">

<h3>Principal's Remark</h3>

<div

class="activity-box"

id="principalRemark">

No Remark

</div>

</div>

</div>

</div>

<script type="module">

import {

getResults

}

from "../firebase/results.js";

async function loadResults(){

const results =

await getResults();

const table =

document.getElementById(

"studentResultsTable"

);

table.innerHTML = "";

if(

results.length===0

){

return;

}

let totalScore = 0;

let overall = "F";

results.forEach(item=>{

totalScore +=

item.total;

let remark =

"Needs Improvement";

if(

item.grade==="A"

){

remark =

"Excellent";

}

else if(

item.grade==="B"

){

remark =

"Very Good";

}

else if(

item.grade==="C"

){

remark =

"Good";

}

table.innerHTML += `

<tr>

<td>${item.subject}</td>

<td>${item.total}</td>

<td>${item.grade}</td>

<td>${remark}</td>

</tr>

`;

});

const average =

Math.round(

totalScore /

results.length

);

if(

average>=70

){

overall="A";

}

else if(

average>=60

){

overall="B";

}

else if(

average>=50

){

overall="C";

}

else if(

average>=45

){

overall="D";

}

else if(

average>=40

){

overall="E";

}

document.getElementById(

"averageScore"

).innerText =

average + "%";

document.getElementById(

"overallGrade"

).innerText =

overall;

/*
Temporary
*/

document.getElementById(

"classPosition"

).innerText =

"-";

document.getElementById(

"teacherRemark"

).innerText =

"Excellent Performance";

document.getElementById(

"principalRemark"

).innerText =

"Keep up the good work";

}

loadResults();

window.logoutStudent =

function(){

if(

confirm(

"Are you sure you want to logout?"

)

){

window.location.href =

"../portal.html";

}

}

</script>
  
</body>

</html>
