<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Management</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="dashboard-container">

<div class="sidebar">

<div class="sidebar-logo">
<img src="../image/ddr2.jpg">
<h3>Admin Panel</h3>
</div>

<ul>

<li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>

<li><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a></li>

<li><a href="parents.html"><i class="fa-solid fa-people-roof"></i> Parents</a></li>

<li class="active">
<a href="attendance.html">
<i class="fa-solid fa-calendar-check"></i>
Attendance
</a>
</li>

</ul>

</div>

<div class="dashboard-main">

<div class="page-header">

<h2>Attendance Management</h2>

<button

class="add-btn"

onclick="openAttendanceModal()">

Mark Attendance

</button>

</div>

<div class="teacher-stats">

<div class="teacher-stat-card">
<h2>1200</h2>
<p>Total Students</p>
</div>

<div class="teacher-stat-card">
<h2>1120</h2>
<p>Present Today</p>
</div>

<div class="teacher-stat-card">
<h2>80</h2>
<p>Absent Today</p>
</div>

</div>

<div class="student-tools">

<input
type="text"
placeholder="Search Student...">

<select>
<option>All Classes</option>
<option>JSS1</option>
<option>JSS2</option>
<option>JSS3</option>
<option>SS1</option>
<option>SS2</option>
<option>SS3</option>
</select>

</div>

<div class="table-container">

<table class="student-table">

<thead>

<tr>
<th>Student</th>
<th>Class</th>
<th>Date</th>
<th>Status</th>
</tr>

</thead>

<tbody id="attendanceTable">


</tbody>

</table>

</div>

</div>

</div>

<div

class="modal"

id="attendanceModal">

<div class="modal-content">

<h3>Mark Attendance</h3>

<select id="attendanceStudent">

<option value="">

Select Student

</option>
  
<option>

Hamza Ibrahim

</option>  

</select>

<input

type="text"

id="attendanceClass"

placeholder="Class">

<input

type="date"

id="attendanceDate">

<select id="attendanceStatus">

<option>

Present

</option>

<option>

Absent

</option>

<option>

Late

</option>

</select>

<button

id="saveAttendanceBtn"

class="save-btn">

Save Attendance

</button>

<button

class="close-btn"

onclick="closeAttendanceModal()">

Close

</button>

</div>

</div>  

<script>

function openAttendanceModal(){

document.getElementById(

"attendanceModal"

).style.display="flex";

}

function closeAttendanceModal(){

document.getElementById(

"attendanceModal"

).style.display="none";

}

</script>

<script type="module">

import {

addAttendance,

getAttendance

}

from "../firebase/attendance.js";

const saveBtn =

document.getElementById(

"saveAttendanceBtn"

);

saveBtn.addEventListener(

"click",

async function(){

const attendance = {

student:

document.getElementById(

"attendanceStudent"

).value,

class:

document.getElementById(

"attendanceClass"

).value,

date:

document.getElementById(

"attendanceDate"

).value,

status:

document.getElementById(

"attendanceStatus"

).value

};

const success =

await addAttendance(

attendance

);

if(success){

alert(

"Attendance saved successfully"

);

closeAttendanceModal();

loadAttendance();

}

else{

alert(

"Unable to save attendance"

);

}

});

async function loadAttendance(){

const records =

await getAttendance();

const table =

document.getElementById(

"attendanceTable"

);

table.innerHTML = "";

records.forEach(item => {

table.innerHTML += `

<tr>

<td>${item.student}</td>

<td>${item.class}</td>

<td>${item.date}</td>

<td>${item.status}</td>

</tr>

`;

});

}

loadAttendance();

</script>  
  
</body>
</html>
