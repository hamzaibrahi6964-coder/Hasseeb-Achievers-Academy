</head>

Parents
</a>
</li>

</ul>

</div>

<div class="dashboard-main">

<div class="page-header">

<h2>Parents Management</h2>

<button class="add-btn" onclick="openParentModal()">
+ Add Parent
</button>

</div>

<div class="teacher-stats">

<div class="teacher-stat-card">
<i class="fa-solid fa-people-roof"></i>
<h2>420</h2>
<p>Total Parents</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-link"></i>
<h2>390</h2>
<p>Linked Accounts</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-user-check"></i>
<h2>400</h2>
<p>Active Parents</p>
</div>

</div>

<div class="student-tools">

<input
type="text"
id="parentSearch"
placeholder="Search Parent...">

<select>
<option>All Classes</option>
<option>JSS1</option>
<option>JSS2</option>
<option>JSS3</option>
<option>SS1</option>
<option>SS2</option>
<option>SS3</option>
</select>

</div>

<div class="table-container">

<table class="student-table">

<thead>

<tr>
<th>Parent Name</th>
<th>Phone</th>
<th>Email</th>
<th>Student</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="parentTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- ADD PARENT MODAL -->

<div class="modal" id="parentModal">

<div class="modal-content">

<h3>Add Parent</h3>

<input
type="text"
id="parentName"
placeholder="Parent Full Name">

<input
type="text"
id="parentPhone"
placeholder="Phone Number">

<input
type="email"
id="parentEmail"
placeholder="Email Address">

<input
type="text"
id="parentOccupation"
placeholder="Occupation">

<textarea

id="parentAddress"

rows="4"

placeholder="Address">

</textarea>

<select id="parentStudent">

<option value="">

Select Student

</option>

<option>

Ahmed Musa

</option>

<option>

Fatima Bello

</option>

</select>

<button

id="saveParentBtn"

class="save-btn">

Save Parent

</button>

<button

class="close-btn"

onclick="closeParentModal()">

Close

</button>

</div>

</div>

<script>

function openParentModal(){

document.getElementById("parentModal")
.style.display="flex";

}

function closeParentModal(){

document.getElementById("parentModal")
.style.display="none";

}

const search =
document.getElementById("parentSearch");

search.addEventListener("keyup", function(){

let filter =
this.value.toLowerCase();

let rows =
document.querySelectorAll(
"#parentTable tr"
);

rows.forEach(row => {

if(
row.innerText
.toLowerCase()
.includes(filter)
){

row.style.display="";

}else{

row.style.display="none";

}

});

});

</script>

<script type="module">

import {

addParent,

getParents

}

from "../firebase/parents.js";

const saveBtn =

document.getElementById(

"saveParentBtn"

);

saveBtn.addEventListener(

"click",

async function(){

const parent = {

name:

document.getElementById(

"parentName"

).value,

phone:

document.getElementById(

"parentPhone"

).value,

email:

document.getElementById(

"parentEmail"

).value,

occupation:

document.getElementById(

"parentOccupation"

).value,

address:

document.getElementById(

"parentAddress"

).value,

student:

document.getElementById(

"parentStudent"

).value,

status:

"Active"

};

const success =

await addParent(

parent

);

if(success){

alert(

"Parent added successfully"

);

closeParentModal();

loadParents();

}

else{

alert(

"Unable to save parent"

);

}

});

async function loadParents(){

const parents =

await getParents();

const table =

document.getElementById(

"parentTable"

);

table.innerHTML = "";

parents.forEach(parent => {

table.innerHTML += `

<tr>

<td>${parent.name}</td>

<td>${parent.phone}</td>

<td>${parent.email}</td>

<td>${parent.student}</td>

<td>

<span class="status-active">

${parent.status}

</span>

</td>

<td>

<button class="edit-btn">

Edit

</button>

<button class="delete-btn">

Delete

</button>

</td>

</tr>

`;

});

}

loadParents();

</script>  

</body>
</html>
