<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Management</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="sidebar-logo">
<img src="../image/ddr2.jpg" alt="Logo">
<h3>Admin Panel</h3>
</div>

<ul>

<li>
<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="students.html">
<i class="fa-solid fa-user-graduate"></i>
Students
</a>
</li>

<li class="active">
<a href="teachers.html">
<i class="fa-solid fa-chalkboard-user"></i>
Teachers
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-users"></i>
Parents
</a>
</li>

<li>
<a href="../index.html">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>
</li>

</ul>

</div>

<!-- MAIN -->

<div class="dashboard-main">

<div class="page-header">

<h2>Teacher Management</h2>

<button class="add-btn" onclick="openTeacherModal()">
+ Add Teacher
</button>

<div class="teacher-stats">

<div class="teacher-stat-card">
<i class="fa-solid fa-chalkboard-user"></i>
<h2>75</h2>
<p>Total Teachers</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-book"></i>
<h2>18</h2>
<p>Subjects</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-user-check"></i>
<h2>72</h2>
<p>Active Teachers</p>
</div>

</div>  

</div>

<div class="student-tools">

<input
type="text"
id="teacherSearch"
placeholder="Search Teacher...">

<select>

<option>All Subjects</option>
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>

</select>

</div>

<div class="table-container">

<table class="student-table">

<thead>

<tr>
<th>Photo</th>
<th>Teacher ID</th>
<th>Name</th>
<th>Subject</th>
<th>Phone</th>
<th>Email</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="teacherTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal" id="teacherModal">

<div class="modal-content">

<h3>Add Teacher</h3>

<input
type="file"
id="teacherPhoto">

<input
type="text"
id="teacherName"
placeholder="Teacher Name">

<input
type="text"
id="teacherId"
placeholder="Teacher ID">

<input
type="text"
id="teacherSubject"
placeholder="Subject">

<input
type="tel"
id="teacherPhone"
placeholder="Phone Number">

<input
type="email"
id="teacherEmail"
placeholder="Email Address">

<input
type="text"
id="teacherQualification"
placeholder="Qualification">

<button
id="saveTeacherBtn"
class="save-btn">

Save Teacher

</button>

<button
class="close-btn"
onclick="closeTeacherModal()">

Close

</button>

</div>

</div>

<script>

function openTeacherModal(){

document.getElementById("teacherModal")
.style.display="flex";

}

function closeTeacherModal(){

document.getElementById("teacherModal")
.style.display="none";

}

function deleteTeacher(){

if(confirm("Delete this teacher?")){

alert("Teacher deleted (Demo)");

}
  
}

const teacherSearch =
document.getElementById("teacherSearch");

teacherSearch.addEventListener("keyup", function(){

let filter =
this.value.toLowerCase();

let rows =
document.querySelectorAll(
"#teacherTable tr"
);

rows.forEach(row => {

if(
row.innerText
.toLowerCase()
.includes(filter)
){

row.style.display="";

}else{

row.style.display="none";

}

});

});

</script>

  
<script type="module">

import {

addTeacher,

getTeachers

}

from "../firebase/teachers.js";

const saveBtn =

document.getElementById(

"saveTeacherBtn"

);

saveBtn.addEventListener(

"click",

async function(){

const teacher = {

name:

document.getElementById(

"teacherName"

).value,

teacherId:

document.getElementById(

"teacherId"

).value,

subject:

document.getElementById(

"teacherSubject"

).value,

phone:

document.getElementById(

"teacherPhone"

).value,

email:

document.getElementById(

"teacherEmail"

).value,

qualification:

document.getElementById(

"teacherQualification"

).value,

status:

"Active"

};

const success =

await addTeacher(

teacher

);

if(success){

alert(

"Teacher added successfully"

);

closeTeacherModal();

loadTeachers();

}

else{

alert(

"Unable to save teacher"

);

}

});

async function loadTeachers(){

const teachers =

await getTeachers();

const table =

document.getElementById(

"teacherTable"

);

table.innerHTML = "";

teachers.forEach(teacher => {

table.innerHTML += `

<tr>

<td>

<img

src="../image/ddr2.jpg"

class="student-avatar">

</td>

<td>${teacher.teacherId}</td>

<td>${teacher.name}</td>

<td>${teacher.subject}</td>

<td>${teacher.phone}</td>

<td>${teacher.email}</td>

<td>

<span class="status-active">

${teacher.status}

</span>

</td>

<td>

<button class="edit-btn">

Edit

</button>

<button class="delete-btn">

Delete

</button>

</td>

</tr>

`;

});

}

loadTeachers();

</script> 

</body>
</html>
