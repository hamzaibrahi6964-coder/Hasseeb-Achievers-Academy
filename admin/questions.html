<html lang="en">

<meta charset="UTF-8">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

<div class="sidebar">

<div class="sidebar-logo">
<img src="../image/ddr2.jpg" alt="">
<h3>Admin Panel</h3>
</div>

<li>
<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="students.html">
<i class="fa-solid fa-user-graduate"></i>
Students
</a>
</li>

<li>
<a href="teachers.html">
<i class="fa-solid fa-chalkboard-user"></i>
Teachers
</a>
</li>

<li>
<a href="results.html">
<i class="fa-solid fa-file-lines"></i>
Results
</a>
</li>

<li>
<a href="cbt.html">
<i class="fa-solid fa-laptop"></i>
CBT System
</a>
</li>

<li class="active">
<a href="questions.html">
<i class="fa-solid fa-circle-question"></i>
Question Bank

<li>
<a href="exam-results.html">
<i class="fa-solid fa-square-poll-vertical"></i>
CBT Results
</a>
</li>
  
</ul>

</div>

<div class="dashboard-main">

<div class="page-header">

<h2>Question Bank</h2>

<button class="add-btn" onclick="openQuestionModal()">
+ Add Question
</button>

</div>

<div class="teacher-stats">

<div class="teacher-stat-card">
<i class="fa-solid fa-circle-question"></i>
<h2>250</h2>
<p>Total Questions</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-book"></i>
<h2>12</h2>
<p>Subjects</p>
</div>

<div class="teacher-stat-card">
<i class="fa-solid fa-layer-group"></i>
<h2>8</h2>
<p>Classes</p>
</div>

</div>

<div class="student-tools">

<input
type="text"
id="questionSearch"
placeholder="Search Questions...">

<select>
<option>All Subjects</option>
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
</select>

</div>

<div class="table-container">

<table class="student-table">

<thead>

<tr>
<th>Subject</th>
<th>Class</th>
<th>Question</th>
<th>Answer</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="questionTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- QUESTION MODAL -->

<div class="modal" id="questionModal">

<div class="modal-content">

<h3>Add CBT Question</h3>

<select id="questionSubject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
</select>

<select id="questionClass">
<option>SS1 Science</option>
<option>SS2 Science</option>
<option>SS3 Science</option>
</select>

<textarea

id="questionText"

placeholder="Enter Question"

rows="4"></textarea>

<input

id="optionA"

type="text"

placeholder="Option A">

<input

id="optionB"

type="text"

placeholder="Option B">

<input

id="optionC"

type="text"

placeholder="Option C">

<input

id="optionD"

type="text"

placeholder="Option D">

<select id="correctAnswer">
<option>Correct Answer</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<button

id="saveQuestionBtn"

class="save-btn">

Save Question

</button>

<button
class="close-btn"
onclick="closeQuestionModal()">
Close
</button>

</div>

</div>

<script>

function openQuestionModal(){

document.getElementById("questionModal")
.style.display="flex";

}

function closeQuestionModal(){

document.getElementById("questionModal")
.style.display="none";

}

function deleteQuestion(){

if(confirm("Delete this question?")){

alert("Question deleted (Demo)");

}

}

const search =
document.getElementById("questionSearch");

search.addEventListener("keyup", function(){

let filter =
this.value.toLowerCase();

let rows =
document.querySelectorAll(
"#questionTable tr"
);

rows.forEach(row => {

if(
row.innerText
.toLowerCase()
.includes(filter)
){

row.style.display="";

}else{

row.style.display="none";

}

});

});

</script>

<script type="module">

import {

addQuestion,

getQuestions

}

from "../firebase/questions.js";

const saveBtn =

document.getElementById(

"saveQuestionBtn"

);

saveBtn.addEventListener(

"click",

async function(){

const question = {

subject:

document.getElementById(

"questionSubject"

).value,

class:

document.getElementById(

"questionClass"

).value,

question:

document.getElementById(

"questionText"

).value,

optionA:

document.getElementById(

"optionA"

).value,

optionB:

document.getElementById(

"optionB"

).value,

optionC:

document.getElementById(

"optionC"

).value,

optionD:

document.getElementById(

"optionD"

).value,

answer:

document.getElementById(

"correctAnswer"

).value

};

const success =

await addQuestion(

question

);

if(success){

alert(

"Question saved successfully"

);

closeQuestionModal();

loadQuestions();

}

else{

alert(

"Unable to save question"

);

}

});

async function loadQuestions(){

const questions =

await getQuestions();

const table =

document.getElementById(

"questionTable"

);

table.innerHTML = "";

questions.forEach(item => {

table.innerHTML += `

<tr>

<td>${item.subject}</td>

<td>${item.class}</td>

<td>${item.question}</td>

<td>${item.answer}</td>

<td>

<button

class="edit-btn">

Edit

</button>

<button

class="delete-btn">

Delete

</button>

</td>

</tr>

`;

});

}

loadQuestions();

</script>
  
</body>
</html>
