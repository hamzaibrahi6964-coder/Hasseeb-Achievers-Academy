<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBT Results</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

<div class="sidebar">

<div class="sidebar-logo">
<img src="../image/ddr2.jpg">
<h3>Admin Panel</h3>
</div>

<ul>

<li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>

<li><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a></li>

<li><a href="results.html"><i class="fa-solid fa-file-lines"></i> Results</a></li>

<li><a href="cbt.html"><i class="fa-solid fa-laptop"></i> CBT System</a></li>

<li><a href="questions.html"><i class="fa-solid fa-circle-question"></i> Question Bank</a></li>

<li class="active">
<a href="exam-results.html">
<i class="fa-solid fa-square-poll-vertical"></i>
CBT Results
</a>
</li>

</ul>

</div>

<div class="dashboard-main">

<div class="page-header">

<h2>CBT Exam Results</h2>

</div>

<div class="result-stats">

<div class="result-card">
<h2 id="totalAttempts">0</h2>
<p>Total Attempts</p>
</div>

<div class="result-card">
<h2 id="averageScore">0%</h2>
<p>Average Score</p>
</div>

<div class="result-card">
<h2 id="passedCount">0</h2>
<p>Passed</p>
</div>

</div>

<div class="student-tools">

<input

id="resultSearch"

type="text"

placeholder="Search Student...">

<select>
<option>All Subjects</option>
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
</select>

</div>

<div class="table-container">

<table class="student-table">

<thead>

<tr>
<th>Student</th>
<th>Class</th>
<th>Subject</th>
<th>Score</th>
<th>Percentage</th>
<th>Status</th>
<th>Time Taken</th>
</tr>

</thead>

<tbody id="cbtResultTable">

</tbody>

</table>

</div>

</div>

</div>
  
<script type="module">

import {

getExams

}

from "../firebase/cbt.js";

async function loadResults(){

const exams =

await getExams();

const table =

document.getElementById(

"cbtResultTable"

);

table.innerHTML = "";

let total = exams.length;

let passed = 0;

let average = 0;

exams.forEach(item => {

let score =

Math.floor(

Math.random()*50

)+1;

let percentage =

Math.floor(

(score/50)*100

);

let status =

percentage >= 50 ?

"Pass"

:

"Fail";

if(status==="Pass"){

passed++;

}

average += percentage;

table.innerHTML += `

<tr>

<td>Student</td>

<td>${item.class}</td>

<td>${item.subject}</td>

<td>${score}/50</td>

<td>${percentage}%</td>

<td>

<span class="status-active">

${status}

</span>

</td>

<td>${item.duration} Minutes</td>

</tr>

`;

});

document.getElementById(

"totalAttempts"

).innerText = total;

document.getElementById(

"passedCount"

).innerText = passed;

document.getElementById(

"averageScore"

).innerText =

total ?

Math.floor(

average/total

)+"%"

:

"0%";

}

loadResults();

</script>
  
</body>
</html>
