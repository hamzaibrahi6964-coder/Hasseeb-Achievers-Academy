<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results Management</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="dashboard-container">

<div class="sidebar">

<div class="sidebar-logo">
<img src="../image/ddr2.jpg">
<h3>Admin Panel</h3>
</div>

<ul>

<li>
<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="students.html">
<i class="fa-solid fa-user-graduate"></i>
Students
</a>
</li>

<li>
<a href="teachers.html">
<i class="fa-solid fa-chalkboard-user"></i>
Teachers
</a>
</li>

<li class="active">
<a href="results.html">
<i class="fa-solid fa-file-lines"></i>
Results
</a>
</li>

</ul>

</div>

<div class="dashboard-main">

<div class="page-header">

<h2>Results Management</h2>

<button class="add-btn">
Generate Result
</button>

</div>

<div class="result-filters">

<select>
<option>2025/2026 Session</option>
<option>2026/2027 Session</option>
</select>

<select>
<option>First Term</option>
<option>Second Term</option>
<option>Third Term</option>
</select>

<select>
<option>SS2 Science</option>
<option>SS1 Science</option>
<option>JSS3</option>
</select>

<select>
<option>Ahmed Musa</option>
<option>Aisha Ibrahim</option>
</select>

</div>

<div class="result-form">

<h3>Enter Subject Scores</h3>

<table class="result-table">

<tr>
<th>Subject</th>
<th>Score</th>
</tr>

<tr>
<td>Mathematics</td>
<td><input type="number" value="85"></td>
</tr>

<tr>
<td>English</td>
<td><input type="number" value="78"></td>
</tr>

<tr>
<td>Physics</td>
<td><input type="number" value="80"></td>
</tr>

<tr>
<td>Chemistry</td>
<td><input type="number" value="75"></td>
</tr>

<tr>
<td>Biology</td>
<td><input type="number" value="88"></td>
</tr>

</table>

<div class="result-summary">

<div class="summary-card">
<h4>Total Score</h4>
<h2>406</h2>
</div>

<div class="summary-card">
<h4>Average</h4>
<h2>81.2%</h2>
</div>

<div class="summary-card">
<h4>Grade</h4>
<h2>A</h2>
</div>

</div>

<button class="save-btn">
Save Result
</button>

</div>

</div>

</div>

</body>
</html>
